<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 500" width="1200" height="500">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050014"/><stop offset=".5" stop-color="#12002c"/><stop offset="1" stop-color="#02000d"/></linearGradient>
 <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#190044"/><stop offset="1" stop-color="#02000c"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="grid" width="50" height="28" patternUnits="userSpaceOnUse"><path d="M50 0H0V28" fill="none" stroke="#8a2be2" stroke-opacity=".22"/></pattern>
</defs>
<rect width="1200" height="500" fill="url(#bg)"/>
<circle cx="920" cy="110" r="72" fill="#b400ff" opacity=".12" filter="url(#soft)"><animate attributeName="r" values="65;82;65" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="920" cy="110" r="42" fill="none" stroke="#e879ff" stroke-width="2" opacity=".8" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 920 110" to="360 920 110" dur="18s" repeatCount="indefinite"/></circle>
<circle cx="920" cy="110" r="55" fill="none" stroke="#6f2cff" stroke-dasharray="3 12" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="360 920 110" to="0 920 110" dur="10s" repeatCount="indefinite"/></circle>
<g fill="#fff"><circle cx="90" cy="60" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle><circle cx="180" cy="110" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="350" cy="55" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="510" cy="95" r="1.5"><animate attributeName="opacity" values="1;.1;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="760" cy="50" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="1080" cy="70" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle></g>
<path d="M-50 430 L1250 430 L1120 300 L80 300 Z" fill="url(#road)"/>
<path d="M0 300 L1200 300" stroke="#d52bff" stroke-opacity=".7" filter="url(#glow)"/>
<path d="M0 430 L1200 430" stroke="#6b1fff" stroke-opacity=".6"/>
<path d="M0 470H1200V500H0Z" fill="url(#grid)"/>
<g fill="#13002b" stroke="#7b2cff" stroke-width="2">
 <path d="M20 300V180H105V300Z"/><path d="M115 300V135H205V300Z"/><path d="M215 300V205H285V300Z"/><path d="M295 300V155H375V300Z"/><path d="M385 300V115H475V300Z"/><path d="M485 300V185H555V300Z"/><path d="M565 300V145H650V300Z"/><path d="M660 300V195H735V300Z"/><path d="M745 300V125H835V300Z"/><path d="M845 300V175H925V300Z"/><path d="M935 300V145H1020V300Z"/><path d="M1030 300V205H1110V300Z"/><path d="M1120 300V160H1190V300Z"/>
</g>
<g fill="#ff39f5" opacity=".8">
 <g><rect x="35" y="200" width="10" height="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.1s" repeatCount="indefinite"/></rect><rect x="65" y="225" width="10" height="4"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></rect></g>
 <g><rect x="135" y="165" width="12" height="5"/><rect x="170" y="195" width="12" height="5"/><rect x="135" y="225" width="12" height="5"/></g>
 <g><rect x="315" y="180" width="12" height="5"/><rect x="350" y="210" width="12" height="5"/><rect x="315" y="240" width="12" height="5"/></g>
 <g><rect x="405" y="145" width="13" height="5"/><rect x="445" y="175" width="13" height="5"/><rect x="405" y="205" width="13" height="5"/><rect x="445" y="235" width="13" height="5"/></g>
 <g><rect x="585" y="175" width="12" height="5"/><rect x="620" y="205" width="12" height="5"/><rect x="585" y="235" width="12" height="5"/></g>
 <g><rect x="770" y="155" width="13" height="5"/><rect x="810" y="185" width="13" height="5"/><rect x="770" y="215" width="13" height="5"/><rect x="810" y="245" width="13" height="5"/></g>
 <g><rect x="960" y="175" width="13" height="5"/><rect x="1000" y="205" width="13" height="5"/><rect x="960" y="235" width="13" height="5"/></g>
</g>
<g font-family="monospace" text-anchor="middle" filter="url(#glow)">
 <text x="600" y="92" font-size="58" font-weight="900" fill="#f5d6ff" stroke="#b51cff" stroke-width="1">ANANYA"><animate attributeName="opacity" values="1;.55;1" dur="2.8s" repeatCount="indefinite"/></text>
 <text x="600" y="122" font-size="15" letter-spacing="7" fill="#d68aff">AI • CODE • CREATE • EXPLORE</text>
</g>
<g font-family="monospace" text-anchor="middle" font-size="12" fill="#ff9aff">
 <text x="160" y="155">PYTHON</text><text x="340" y="175">AI</text><text x="430" y="135">DSA</text><text x="610" y="165">BUILD / BREAK</text><text x="790" y="145">PROJECTS</text><text x="980" y="165">GITHUB</text>
</g>
<g fill="none" stroke="#ff35ff" stroke-width="2" opacity=".7"><path d="M180 260 Q300 215 430 260 T680 250 T950 260" stroke-dasharray="5 15"><animate attributeName="stroke-dashoffset" from="0" to="-200" dur="4s" repeatCount="indefinite"/></path></g>
<g filter="url(#glow)"><circle cx="120" cy="390" r="4" fill="#ff5bff"><animate attributeName="cx" values="120;1080;120" dur="8s" repeatCount="indefinite"/></circle><circle cx="1080" cy="410" r="3" fill="#8b5cff"><animate attributeName="cx" values="1080;120;1080" dur="6s" repeatCount="indefinite"/></circle></g>
<g font-family="monospace" fill="#8d63ff" font-size="12"><text x="35" y="480">SYSTEM // ONLINE</text><text x="965" y="480">CODE IS THE CITY</text></g>
<!-- shooting star -->
<path d="M1040 25 L1090 75" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" begin="2s"/><animateTransform attributeName="transform" type="translate" values="-120 -60;0 0;120 60" dur="1.8s" repeatCount="indefinite" begin="2s"/></path>
</svg>
